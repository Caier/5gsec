<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Flask Server</title>
    <!-- <meta http-equiv="refresh" content="2"> -->
    <link  rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div id="all">
<h2>Podaj numer telefonu zarejestrowanego użytkownika</h2>
<form action="{{ url_for('set_command') }}" method="post">
    <input type="number" name="command" required>
    <div id="uno"></div>
    <button type="submit">Wyślij</button>
</form>
<form action="{{ url_for('save_data') }}" method="post">
    <button type="submit">Zapisz pobrane dane do pliku</button>
</form>


<fieldset class="scroll-fieldset">
<legend>Pobrane dane:</legend>
<div id="data-box">
    <p>Brak danych</p>
</div>
</fieldset>
</div>

<script>
async function fetchData() {
    try {
        const response = await fetch("/data_list");
        const data = await response.json();

        const box = document.getElementById("data-box");
        box.innerHTML = "";

        if (data.length === 0) {
            box.innerHTML = "<p>Brak danych</p>";
            return;
        }

        data.forEach(item => {
            const pre = document.createElement("pre");
            pre.textContent = item;
            box.appendChild(pre);

            const hr = document.createElement("hr");
            box.appendChild(hr);
        });
    } catch (err) {
        console.error("Błąd fetch:", err);
    }
}


setInterval(fetchData, 2000);


fetchData();
</script>
  
</body>
</html>
